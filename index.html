<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Japan Tours CRM — Japan Tour Management</title>
<meta name="theme-color" content="#0b1f3a">
<style>
:root{--bg:#f3f0e8;--surf:#fdfcf8;--ink:#0b1f3a;--mut:#5a6a82;--line:#ddd8ca;--lag:#13335f;--lagd:#0b1f3a;--sun:#c9a24a;--hib:#b8344f;--ok:#2f7d57;--chip:#ebe6d9;--nav:#0b1f3a;--onlag:#fff;

:root[data-theme="dark"]{--bg:#07142a;--surf:#0e2142;--ink:#f1ece0;--mut:#9cabc4;--line:#1f3a66;--lag:#d9b45a;--lagd:#c9a24a;--sun:#d9b45a;--hib:#ef7a93;--ok:#5ec68b;--chip:#162d52;--nav:#050e1e;--onlag:#0b1f3a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}

.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--nav);color:#e6f0f2;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
nav .logo{font:700 20px "Bricolage Grotesque",sans-serif;padding:0 10px 18px;color:#d9b45a}
nav .logo small{display:block;font:400 12px "Instrument Sans";color:#8fa6ae;margin-top:2px}
nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;color:#b9cdd3;cursor:pointer}
nav button:hover{background:#17325a}

main{padding:28px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}

.btn{background:var(--lag);color:var(--onlag);border:0;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--lagd)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--hib);border:1px solid var(--hib)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px}
.kpi span{color:var(--mut);font-size:13px}
.kpi b{display:block;font:700 26px "Bricolage Grotesque",sans-serif;margin-top:4px}
.kpi.main{background:var(--nav);color:#e6f0f2;border-color:var(--nav)}.kpi.main b{color:#d9b45a}.kpi.main span{color:#8fa6ae}
.two{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:18px;margin-bottom:14px}

.bar i{display:block;height:12px;border-radius:6px;background:var(--lag)}
.bar em{font-style:normal;text-align:right;color:var(--mut)}
.fu{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.fu:first-of-type{border-top:0}
.fu small{color:var(--mut);display:block}
.late{color:var(--hib);font-weight:600}
.board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 268px;background:var(--chip);border-radius:12px;border-top:3px solid var(--sun);padding:10px}
.col h3{font-size:15px;padding:4px 6px 10px;display:flex;justify-content:space-between}
.col h3 small{font:500 12px "Instrument Sans";color:var(--mut)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:9px}
.card b{display:block;cursor:pointer}
.card p{margin:2px 0;color:var(--mut);font-size:13px}
.card .val{color:var(--ink);font-weight:600;margin-top:6px}
.card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.mv{background:var(--chip);border:0;border-radius:6px;width:30px;height:28px;cursor:pointer}
.mv:disabled{opacity:.3;cursor:default}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--chip)}
.tag.s3{background:var(--ok);color:#fff}.tag.s4{background:var(--mut);color:var(--surf)}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input,.tools select,dialog input,dialog select,dialog textarea{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.tools input{max-width:320px}.tools select{max-width:200px}
.wrap{overflow-x:auto;background:var(--surf);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
th{color:var(--mut);font-weight:500}
tbody tr{cursor:pointer}tbody tr:hover{background:var(--chip)}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.pk .panel b{font:700 20px "Bricolage Grotesque",sans-serif;display:block;margin-top:6px}
.empty{color:var(--mut);padding:14px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surf);color:var(--ink);width:min(560px,94vw);padding:22px}
dialog::backdrop{background:rgba(8,20,25,.55)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.g label{font-size:13px;color:var(--mut);display:block}
.g .f{grid-column:1/-1}
.acts{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:760px){
.app{grid-template-columns:1fr}
nav{position:sticky;top:0;height:auto;flex-direction:row;overflow-x:auto;padding:10px;z-index:5;gap:4px}
nav .logo{display:none}nav button{white-space:nowrap}
main{padding:18px 14px}.two{grid-template-columns:1fr}.g{grid-template-columns:1fr}
.bar{grid-template-columns:100px 1fr 60px}
}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
[hidden]{display:none!important}
.push{margin-top:auto!important}
nav [data-logout]{color:#e9a4b4}
#auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--nav)}
.acard{background:var(--surf);border-radius:16px;padding:28px;width:min(400px,100%);border-top:4px solid var(--sun)}
.acard h1{font-size:26px}
.acard label{display:block;margin-top:14px;font-size:13px;color:var(--mut)}
.acard input{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surf);font-size:16px}
.pw{position:relative}.pw input{padding-right:104px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--lag);font-weight:600;cursor:pointer;padding:8px}
.err{color:var(--hib);font-size:14px;min-height:20px;margin-top:10px}.err.okm{color:var(--ok)}
.acard .btn{width:100%;margin-top:10px;min-height:46px}
.lnk{background:none;border:0;color:var(--lag);font-weight:600;cursor:pointer;padding:8px 4px}
.lo{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;margin-bottom:10px}
.lo input{width:auto;accent-color:var(--lag)}
.lo:has(input:checked){border-color:var(--sun);box-shadow:0 0 0 2px var(--sun)}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button,a,tr,.card b,.fu{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.board{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.col{scroll-snap-align:start}
@media (max-width:760px){
input,select,textarea{font-size:16px!important}
.mv{width:42px;height:40px;font-size:18px}
.col{flex-basis:84vw}
.btn{padding:11px 16px;min-height:44px}
nav{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;border-top:1px solid #c9a24a}
nav button{flex:1;text-align:center;padding:8px 2px;font-size:11.5px;min-height:46px}
main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{border:0;background:none;overflow:visible}
table{min-width:0;display:block}thead{display:none}tbody{display:block}
tbody tr{display:flex;flex-wrap:wrap;gap:3px 12px;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
tbody td{border:0;padding:0;font-size:14px;color:var(--mut)}
tbody td:first-child{flex:1 0 100%;color:var(--ink);font-weight:600;font-size:15px}
dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:16px 16px 0 0;max-height:92dvh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="auth" hidden></div>
<div class="app" hidden>
<nav aria-label="Menu utama">
<div class="logo">Japan Tours CRM<small>Japan Tour Management</small></div>
<button data-v="home">Summary</button>
<button data-v="pipe">Pipeline</button>
<button data-v="cust">Customers</button>
<button data-v="pkg">Tours Package</button><button data-v="set" class="push">Setting</button><button data-logout>Logout</button>
</nav>
<main id="main"></main>
</div>

<dialog id="ldlg">
  <h2>Select Language</h2>
  <div style="margin:16px 0 8px">
    <label class="lo">
      <input type="radio" name="lg" value="en">
      <span translate="no">English</span>
    </label>
    <label class="lo">
      <input type="radio" name="lg" value="ja">
      <span translate="no">日本語</span>
    </label>
  </div>
  <div class="acts" style="justify-content:flex-end">
    <button type="button" class="btn ghost" id="lc">Cancel</button>
    <button type="button" class="btn" id="ls">Save</button>
  </div>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="frm" onsubmit="return false">
    <h2 id="dt">New Lead</h2>

    <div class="g">
      <div>
        <label for="n">Customer Name</label>
        <input id="n" required>
      </div>

      <div>
        <label for="w">WhatsApp</label>
        <input id="w" inputmode="tel" placeholder="08123456789">
      </div>

      <div>
        <label for="p">Japan Tour Package</label>
        <select id="p"></select>
      </div>

      <div>
        <label for="s">Lead Source</label>
        <select id="s"></select>
      </div>

      <div>
        <label for="k">Customer's Country</label>
        <select id="k"></select>
      </div>

      <div>
        <label for="sp">Tour Specialist (Sales)</label>
        <select id="sp"></select>
      </div>

      <div>
        <label for="x">Number of Travelers</label>
        <input id="x" type="number" min="1" value="2">
      </div>

      <div>
        <label for="v">Deal Value (IDR)</label>
        <input id="v" type="number" min="0" placeholder="Automatically set from package">
      </div>

      <div>
        <label for="d">Departure Date</label>
        <input id="d" type="date">
      </div>

      <div>
        <label for="f">Follow-up Date</label>
        <input id="f" type="date">
      </div>

      <div class="f">
        <label for="t">Stage</label>
        <select id="t"></select>
      </div>

      <div class="f">
        <label for="c">Notes</label>
        <textarea id="c" rows="3"></textarea>
      </div>
    </div>

    <div class="acts">
      <button type="button" class="btn danger" id="del">Delete</button>
      <span>
        <button type="button" class="btn ghost" id="cancel">Cancel</button>
        <button type="button" class="btn" id="save">Save</button>
      </span>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ===== ISI DUA BARIS INI DARI SUPABASE (Project Settings > API) =====
const SUPABASE_URL='https://wivitvllhhowbizunecf.supabase.co';

// ====================================================================
const PK=[{n:'Japan: Tokyo–Fuji 5D4N',p:14500000,d:'Shibuya, Hakone, Mount Fuji'},{n:'Japan: Kyoto–Osaka 6D5N',p:16800000,d:'Fushimi Inari, Arashiyama, Dotonbori'},{n:'Japan: Hokkaido Snow 6D5N',p:19500000,d:'Sapporo, Otaru, Niseko'},{n:'Japan: Sakura 7D6N',p:21000000,d:'Tokyo, Kyoto, hanami spring'}];
const ST=['New Prospect','Offer','Negotiations','Confirmed','Paid'];
const SRC=['Instagram','WhatsApp','Website','Referral','Travel fair','Korporat'];
const KEY='Japan Tours-crm-v3';let lang='id';try{lang=localStorage.getItem('Japan Tours-lang')||'id'}catch(e){}
const CT=['Indonesia','Singapore','Malaysia','Australia','Netherland','India','US','South Korea','Saudi Arabia','Lainnya'];
let SP=[];
const day=o=>{const d=new Date();d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};
const seed=()=>[
{id:1,n:'Rina Kusuma',w:'081234567801',p:0,s:0,k:0,sp:0,x:2,v:29000000,d:day(40),f:day(1),t:0,c:'Bulan madu, ingin lihat Mount Fuji.'},
{id:2,n:'PT Maju Sejahtera',w:'081234567802',p:1,s:5,k:0,sp:2,x:20,v:336000000,d:day(60),f:day(-2),t:2,c:'Perjalanan insentif karyawan, butuh invoice.'},
{id:7,n:'Sari Lestari',w:'081234567807',p:3,s:4,k:0,sp:0,x:2,v:42000000,d:day(-20),f:'',t:4,c:'Puas, minta Contact untuk perjalanan berikutnya.'},
{id:9,n:'Tan Wei Ming',w:'+60123456789',p:0,s:2,x:4,v:58000000,k:2,sp:1,d:day(50),f:day(2),t:1,c:'Logoutga dari Kuala Lumpur, Departure via KLIA.'},
{id:10,n:'Emily Carter',w:'+61412345678',p:2,s:3,x:2,v:39000000,k:3,sp:1,d:day(75),f:day(4),t:2,c:'Pasangan dari Sydney, ingin ski di Niseko.'},
{id:11,n:'Aarav Sharma',w:'+919812345678',p:1,s:1,x:6,v:100800000,k:5,sp:3,d:day(55),f:day(-1),t:2,c:'Grup Logoutga dari Mumbai, butuh makanan vegetarian.'},
{id:12,n:'Lim Hui Ling',w:'+6591234567',p:3,s:0,x:2,v:42000000,k:1,sp:2,d:day(160),f:'',t:3,c:'DP sudah dibayar, musim sakura.'},
{id:13,n:'Park Ji-woo',w:'+821012345678',p:0,s:5,x:8,v:116000000,k:7,sp:0,d:day(85),f:day(6),t:0,c:'Korporat, minta Offer grup.'},
{id:14,n:'Jan de Vries',w:'+31612345678',p:1,s:2,x:2,v:33600000,k:4,sp:2,d:day(45),f:'',t:3,c:'Lunas, tiket sudah diterbitkan.'}];
let D=[],PF=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>'Rp'+new Intl.NumberFormat('id-ID').format(Math.round(n||0));
const UN={id:[' jt',' M'],en:[' mn',' bn'],ja:['百万','十億']};const f1=v=>{const s=v.toFixed(1);return lang==='id'?s.replace('.',','):s};const jt=n=>n>=1e9?f1(n/1e9)+UN[lang][1]:n>=1e6?f1(n/1e6)+UN[lang][0]:rp(n);
const dt=s=>s?new Date(s+'T00:00').toLocaleDateString(({id:'id-ID',en:'en-GB',ja:'ja-JP'})[lang],{day:'numeric',month:'short',year:'numeric'}):'–';
const today=day(0);
let view='home',q='',fs='',fp='',qt;

function render(){
 document.querySelectorAll('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.v===view)||b.removeAttribute('aria-current'));
 document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.v===view)b.setAttribute('aria-current','page')});
 const m=$('#main');
 if(view==='home')m.innerHTML=home();
 if(view==='pipe')m.innerHTML=pipe();
 if(view==='cust')m.innerHTML=cust();
 if(view==='pkg')m.innerHTML=pkg();if(view==='set')m.innerHTML=setv();[m,$('nav'),$('#dlg'),$('#ldlg')].forEach(tr);
}
const head=(t,btn=true)=>`<div class="top"><h1>${t}</h1>${btn?'<button class="btn" data-add>Add Prospect</button>':''}</div>`;

function home(){
 const act=D.filter(x=>x.t<3),conf=D.filter(x=>x.t>=3);
 const pv=act.reduce((a,x)=>a+(+x.v||0),0),cv=conf.reduce((a,x)=>a+(+x.v||0),0);
 const conv=D.length?Math.round(conf.length/D.length*100):0;
 const by={};D.filter(x=>x.t>=3).forEach(x=>{const k=PK[x.p].n;by[k]=(by[k]||0)+(+x.v||0)});
 const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);const mx=rows[0]?rows[0][1]:1;
 const fu=act.filter(x=>x.f).sort((a,b)=>a.f<b.f?-1:1).slice(0,6);
 return head('Summary')+`
 <div class="kpis">
 <div class="kpi main"><span>Confirmed revenue</span><b>${jt(cv)}</b></div>
 <div class="kpi"><span>Pipeline Value</span><b>${jt(pv)}</b></div>
 <div class="kpi"><span>Active prospects</span><b>${act.length}</b></div>
 <div class="kpi"><span>Conversion rate</span><b>${conv}%</b></div></div>
 <div class="two">
 <div class="panel"><h2>Revenue per package</h2>${rows.length?rows.map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><span><i style="width:${Math.max(4,v/mx*100)}%"></i></span><em>${jt(v)}</em></div>`).join(''):'<p class="empty">No confirmed transactions yet.</p>'}</div>
 <div class="panel"><h2>Immediate Steps</h2>${fu.length?fu.map(x=>`<div class="fu" data-id="${x.id}"><div>${esc(x.n)}<small>${esc(PK[x.p].n)} · ${ST[x.t]}</small></div><span class="${x.f<today?'late':''}">${x.f<today?'Late · ':''}${dt(x.f)}</span></div>`).join(''):'<p class="empty">There Is No Follow-Up Schedule.</p>'}</div>${perf()}${ctry()}
 </div>`;
}

function perf(){
  return `<div class="panel"><h2>Tour specialist performance</h2>
  <div class="wrap" style="border:0"><table style="min-width:420px">
  <thead><tr><th>Person Responsible</th><th>prospect</th><th>Booking</th><th>Pendapatan</th></tr></thead>
  <tbody>${SP.map((n,i)=>{
    const l=D.filter(x=>x.sp===i),c=l.filter(x=>x.t>=3);
    return `<tr style="cursor:default">
      <td>${esc(n)}</td><td>${l.length}</td><td>${c.length}</td>
      <td>${jt(c.reduce((a,x)=>a+(+x.v||0),0))}</td>
    </tr>`;
  }).join('')}</tbody></table></div></div>`;
}

function ctry(){const c={};D.forEach(x=>c[x.k]=(c[x.k]||0)+1);const r=Object.entries(c).sort((a,b)=>b[1]-a[1]);const m=r.length?r[0][1]:1;return `<div class="panel"><h2>Clients By Country</h2>${r.map(([k,n])=>`<div class="bar"><span>${CT[k]}</span><span><i style="width:${n/m*100}%"></i></span><em>${n}</em></div>`).join('')||'<p class="empty">No clients yet.</p>'}</div>`}
function card(x){
 const wa='https://wa.me/'+String(x.w||'').replace(/\D/g,'').replace(/^0/,'62');
 return `<div class="card"><b data-id="${x.id}">${esc(x.n)}</b><p>${esc(PK[x.p].n)} · ${x.x} participant</p><p>${CT[x.k]} · Specialist: ${SP[x.sp]}</p><p>Departure ${dt(x.d)}</p>
 ${x.f&&x.t<3?`<p class="${x.f<today?'late':''}">Tindak lanjut ${dt(x.f)}</p>`:''}
 <div class="val">${rp(x.v)}</div>
 <div class="row"><a href="${wa}" target="_blank" rel="noopener" class="tag">WhatsApp</a>
 <span><button class="mv" data-mv="-1" data-id="${x.id}" aria-label="Pindah ke Step sebelumnya" ${x.t===0?'disabled':''}>‹</button> <button class="mv" data-mv="1" data-id="${x.id}" aria-label="Pindah ke Step berikutnya" ${x.t===4?'disabled':''}>›</button></span></div></div>`;
}
function pipe(){

const toD = r => {

  let idx = SP.findIndex(n => n === Name);

    w: r.whatsapp || '',

    k: r.Country ?? 0,

    d: r.Departure || '',

});

async function loadAll() {
  const [profilesRes, namesRes, prospectsRes] = await Promise.all([
    sb.from('profiles').select('id,Name,role').order('Name'),
    sb.from('Sign Up_person_in_charge')
      .select('id,Name')
      .eq('aktif', true)
      .order('Name'),
    sb.from('prospect').select('*').order('dibuat', { ascending: false })
  ]);

  if (profilesRes.error) return fail(profilesRes.error);
  if (namesRes.error) return fail(namesRes.error);
  if (prospectsRes.error) return fail(prospectsRes.error);

  PF = profilesRes.data || [];
  SP = (namesRes.data || []).map(x => x.Name);
  SP_BY_NAME = new Map(SP.map((Name, i) => [Name, i]));

  if (!SP.length) {
    return fail({ message: 'Sign Up Person Responsible masih Vacant.' });
  }

  $('#sp').innerHTML = SP
    .map((Name, i) => `<option value="${i}">${esc(Name)}</option>`)
    .join('');

  D = prospectsRes.data.map(toD);
  render();
}

let holdAuth = false, live = false;
document.addEventListener('submit',async e=>{
 if(e.target.id!=='af')return;e.preventDefault();
 const su=!!$('#an'),em=$('#ae').value.trim().toLowerCase(),p=$('#ap').value,err=t=>{const x=$('#aerr');x.className='err';x.textContent=t;tr(x)};
 if(!em||!p||(su&&(!$('#an').value.trim()||!$('#ak').value.trim())))return err('Isi semua kolom.');
 if(!/^\S+@\S+\.\S+$/.test(em))return err('Format email tidak valid.');
 const btn=e.target.querySelector('[type=submit]');btn.disabled=true;
 try{
  if(su){
   if(p.length<6)return err('Password minimal 6 karakter.');
   if(p!==$('#ac').value)return err('Confirm password tidak sama.');
   holdAuth=true;
   const r=await sb.auth.signUp({email:em,password:p,options:{data:{Name:$('#an').value.trim(),kode:$('#ak').value.trim()}}});
   if(r.error){holdAuth=false;const m=r.error.message||'';return err(/already|registered/i.test(m)?'Email sudah terSign Up.':/database error|kode/i.test(m)?'Kode undangan salah.':m)}
   await sb.auth.signOut();holdAuth=false;
   showAuth('in','Account berhasil dibuat. Silakan Submit dengan email Anda.',em);
  }else{
   const r=await sb.auth.signInWithPassword({email:em,password:p});
   if(r.error)return err('ID atau password salah.');
  }
 }finally{btn.disabled=false}
});
async function boot(){
 document.documentElement.lang=lang;
 const g=await sb.auth.getSession(),u=g.data.session&&g.data.session.user;
 if(!u){SES=null;D=[];$('#auth').hidden=false;document.querySelector('.app').hidden=true;showAuth('in');return}
 const pr=await sb.from('profiles').select('Name,role').eq('id',u.id).maybeSingle();
 SES={id:u.id,email:u.email,Name:(pr.data&&pr.data.Name)||u.email,role:pr.data&&pr.data.role};
 $('#auth').hidden=true;document.querySelector('.app').hidden=false;view='home';render();loadAll();
 if(!live){live=true;sb.channel('prospect-live').on('postgres_changes',{event:'*',schema:'public',table:'prospect'},()=>{if(SES)loadAll()}).subscribe()}
}
sb.auth.onAuthStateChange(ev=>{if(holdAuth)return;if(ev==='SIGNED_IN'&&SES)return;if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')boot()});
boot();
</script>
